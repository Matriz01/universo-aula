<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" role="img" aria-label="Universo Aula — galaxia educativa">
  <title>Universo Aula</title>
  <desc>Cabecera con galaxia espiral, planetas y estrellas en estilo educativo y moderno.</desc>

  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1142"/>
      <stop offset="55%" stop-color="#0b0b22"/>
      <stop offset="100%" stop-color="#04030f"/>
    </radialGradient>

    <radialGradient id="galaxyCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fff7e0" stop-opacity="1"/>
      <stop offset="20%" stop-color="#ffd28a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#e36ec6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3b1d6b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="armGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#a4d8ff" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#5b6cff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1c0e44" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ff9ad8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ff9ad8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#7be7ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7be7ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planetTeal" cx="35%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#9ff8e4"/>
      <stop offset="55%" stop-color="#1f9aa6"/>
      <stop offset="100%" stop-color="#0a3a45"/>
    </radialGradient>

    <radialGradient id="planetCoral" cx="35%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#ffd1c2"/>
      <stop offset="55%" stop-color="#e26b54"/>
      <stop offset="100%" stop-color="#5a1f15"/>
    </radialGradient>

    <radialGradient id="planetGold" cx="35%" cy="35%" r="70%">
      <stop offset="0%"  stop-color="#fff2c2"/>
      <stop offset="55%" stop-color="#d6a64a"/>
      <stop offset="100%" stop-color="#5a3c0e"/>
    </radialGradient>

    <linearGradient id="ringGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"  stop-color="#ffd28a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffd28a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd28a" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a4d8ff"/>
      <stop offset="100%" stop-color="#e36ec6"/>
    </linearGradient>

    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="bigBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>

    <!-- Reusable star shape -->
    <symbol id="star" viewBox="-1 -1 2 2">
      <circle r="1" fill="#ffffff"/>
    </symbol>
    <symbol id="star4" viewBox="-10 -10 20 20">
      <path d="M0 -9 L1.6 -1.6 L9 0 L1.6 1.6 L0 9 L-1.6 1.6 L-9 0 L-1.6 -1.6 Z" fill="#ffffff"/>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1920" height="600" fill="url(#bg)"/>

  <!-- Distant nebulae -->
  <ellipse cx="380"  cy="180" rx="320" ry="160" fill="url(#nebulaCyan)" filter="url(#bigBlur)"/>
  <ellipse cx="1620" cy="420" rx="380" ry="200" fill="url(#nebulaPink)" filter="url(#bigBlur)"/>

  <!-- Star field (random scatter, hand-placed for nice composition) -->
  <g fill="#ffffff" opacity="0.9">
    <circle cx="60"   cy="80"  r="0.9"/>
    <circle cx="120"  cy="220" r="0.6"/>
    <circle cx="200"  cy="60"  r="1.2"/>
    <circle cx="280"  cy="320" r="0.7"/>
    <circle cx="340"  cy="450" r="0.9"/>
    <circle cx="420"  cy="140" r="0.5"/>
    <circle cx="500"  cy="500" r="1.0"/>
    <circle cx="540"  cy="40"  r="0.8"/>
    <circle cx="620"  cy="380" r="0.6"/>
    <circle cx="700"  cy="80"  r="1.4"/>
    <circle cx="760"  cy="540" r="0.7"/>
    <circle cx="820"  cy="200" r="0.9"/>
    <circle cx="900"  cy="100" r="0.5"/>
    <circle cx="980"  cy="460" r="1.1"/>
    <circle cx="1040" cy="60"  r="0.7"/>
    <circle cx="1120" cy="380" r="0.6"/>
    <circle cx="1200" cy="160" r="1.2"/>
    <circle cx="1260" cy="520" r="0.8"/>
    <circle cx="1320" cy="40"  r="0.9"/>
    <circle cx="1400" cy="280" r="0.5"/>
    <circle cx="1460" cy="120" r="1.0"/>
    <circle cx="1540" cy="500" r="0.7"/>
    <circle cx="1620" cy="80"  r="0.8"/>
    <circle cx="1680" cy="340" r="0.6"/>
    <circle cx="1760" cy="220" r="1.3"/>
    <circle cx="1820" cy="500" r="0.5"/>
    <circle cx="1880" cy="60"  r="0.9"/>
    <circle cx="80"   cy="540" r="0.6"/>
    <circle cx="240"  cy="500" r="0.5"/>
    <circle cx="380"  cy="320" r="0.7"/>
    <circle cx="660"  cy="220" r="0.5"/>
    <circle cx="1080" cy="220" r="0.8"/>
    <circle cx="1340" cy="380" r="0.6"/>
    <circle cx="1700" cy="180" r="0.9"/>
  </g>

  <!-- Sparkle stars (4-pointed) -->
  <use href="#star4" x="160"  y="120" width="14" height="14" opacity="0.95"/>
  <use href="#star4" x="780"  y="60"  width="10" height="10" opacity="0.9"/>
  <use href="#star4" x="1100" y="500" width="16" height="16" opacity="0.95"/>
  <use href="#star4" x="1520" y="220" width="12" height="12" opacity="0.9"/>
  <use href="#star4" x="1820" y="380" width="14" height="14" opacity="0.95"/>

  <!-- Galaxy (left-of-center) -->
  <g transform="translate(700 300) rotate(-22)">
    <!-- Halo -->
    <ellipse cx="0" cy="0" rx="360" ry="120" fill="url(#armGlow)"/>
    <!-- Spiral arms (suggested with elliptical bands) -->
    <ellipse cx="0" cy="0" rx="320" ry="90"  fill="none" stroke="#a4d8ff" stroke-width="1.4" stroke-opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="260" ry="72"  fill="none" stroke="#c5b6ff" stroke-width="1.4" stroke-opacity="0.50"/>
    <ellipse cx="0" cy="0" rx="200" ry="58"  fill="none" stroke="#ffb1e3" stroke-width="1.4" stroke-opacity="0.55"/>
    <ellipse cx="0" cy="0" rx="140" ry="44"  fill="none" stroke="#ffd28a" stroke-width="1.4" stroke-opacity="0.60"/>
    <!-- Dust dots along arms -->
    <g fill="#ffffff" opacity="0.85">
      <circle cx="-300" cy="-10" r="1.2"/>
      <circle cx="-260" cy="20"  r="0.9"/>
      <circle cx="-200" cy="-30" r="1.1"/>
      <circle cx="-150" cy="35"  r="0.8"/>
      <circle cx="-90"  cy="-20" r="1.0"/>
      <circle cx="60"   cy="20"  r="0.9"/>
      <circle cx="120"  cy="-25" r="1.2"/>
      <circle cx="180"  cy="30"  r="0.8"/>
      <circle cx="240"  cy="-15" r="1.0"/>
      <circle cx="300"  cy="20"  r="0.9"/>
      <circle cx="-220" cy="50"  r="0.6" fill="#ffd28a"/>
      <circle cx="200"  cy="-50" r="0.6" fill="#ff9ad8"/>
    </g>
    <!-- Core glow -->
    <ellipse cx="0" cy="0" rx="120" ry="44" fill="url(#galaxyCore)"/>
    <ellipse cx="0" cy="0" rx="40"  ry="14" fill="#fff7e0" filter="url(#soft)"/>
  </g>

  <!-- Planet 1 — turquoise / oceans (lower-left) -->
  <g transform="translate(280 470)">
    <circle r="68" fill="url(#planetTeal)"/>
    <ellipse cx="-22" cy="-6" rx="32" ry="6" fill="#ffffff" opacity="0.18"/>
    <ellipse cx="14"  cy="22" rx="22" ry="4" fill="#ffffff" opacity="0.12"/>
    <circle r="68" fill="none" stroke="#9ff8e4" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- Planet 2 — coral / Mars-style (upper-right) -->
  <g transform="translate(1480 150)">
    <circle r="50" fill="url(#planetCoral)"/>
    <ellipse cx="-10" cy="-6" rx="20" ry="5" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- Planet 3 — gold + ring (mid-right) -->
  <g transform="translate(1700 320) rotate(-18)">
    <ellipse cx="0" cy="0" rx="120" ry="14" fill="url(#ringGrad)" opacity="0.95"/>
    <ellipse cx="0" cy="0" rx="120" ry="14" fill="none" stroke="#ffe1a0" stroke-width="1" opacity="0.7"/>
    <circle r="44" fill="url(#planetGold)"/>
    <ellipse cx="-14" cy="-8" rx="14" ry="4" fill="#ffffff" opacity="0.18"/>
    <!-- Ring overlap (front part) -->
    <path d="M -120 0 A 120 14 0 0 0 120 0" fill="none" stroke="#ffe1a0" stroke-width="2" opacity="0.0"/>
    <ellipse cx="0" cy="0" rx="120" ry="14" fill="none" stroke="#ffd28a" stroke-width="2" opacity="0.65" stroke-dasharray="0 0"/>
  </g>

  <!-- Tiny moon next to planet 1 -->
  <circle cx="370" cy="430" r="9" fill="#e8e8ee"/>
  <circle cx="370" cy="430" r="9" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.4"/>

  <!-- Orbit suggestion (subtle) -->
  <ellipse cx="700" cy="300" rx="900" ry="220" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
  <ellipse cx="700" cy="300" rx="700" ry="170" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Title -->
  <g transform="translate(120 235)">
    <text font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
          font-weight="800" font-size="86" letter-spacing="-2"
          fill="url(#title)">Universo Aula</text>
    <text y="56" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"
          font-weight="500" font-size="22" letter-spacing="2"
          fill="#cdd5ff" opacity="0.85">EXPLORA EL COSMOS DESDE EL AULA</text>
  </g>
</svg>
